# 夜间与手动触发的桌面审计。
#
# 这条审计驱动真实的 Electron 窗口，检查原生窗口区域、点击穿透、跟随位移和
# 额度界面——也就是单元测试碰不到的那一层。它刻意不挂在 push / PR 上：
#
#   - 它需要先下载 Electron 运行时（约 100 MB），并且要开真实窗口；
#   - 原生窗口几何与穿透断言依赖合成器和显示环境，在 CI 虚拟机上容易因为环境
#     而不是因为代码变红。
#
# 一个会偶发变红的门禁比没有门禁更糟：它会训练人忽略红色。所以它先放在每晚
# 的定时任务和手动触发里。GitHub 只在默认分支上调度 schedule；合并到 main 后
# 才会按 cron 运行。要把它变成每次提交的硬门槛，需要先在 CI 上连续观察若干次，
# 确认稳定之后再改 `on:`。
name: Desktop audit

on:
  workflow_dispatch:
  # Nightly rather than per-commit: a scheduled run never blocks a merge, so a
  # flaky window-geometry run is visible without training people to ignore red.
  schedule:
    - cron: '17 3 * * *'

# 只需要读仓库；审计产物写到 qa-*/ 下的临时目录，不发布任何东西。
permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      # 桌面组件不在 npm 依赖里：安装器会把它放到数据目录下，审计按同一位置查找。
      - name: Install the Electron desktop runtime
        run: node scripts/install-desktop.mjs

      # 输出目录用 qa- 前缀，与 .gitignore 的 qa-*/ 一致，不会污染工作区。
      - name: Desktop audit
        run: node tests/desktop-audit-smoke.mjs qa-desktop-audit

      # 气泡可读性的目视回归：渲染几种真实内容并截图，同时打印每次 fit 的
      # 实际缩放比。它和上面的审计共用同一份 Electron 运行时。
      - name: Bubble visual regression
        run: node tests/bubble-visual.mjs qa-bubble-visual

      - name: Upload audit output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-audit-output
          path: |
            qa-desktop-audit
            qa-bubble-visual
          if-no-files-found: ignore
