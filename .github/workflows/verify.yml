# 提交门禁：把仓库已有的检查自动化。
#
# 在这之前，`npm test` 与 `python scripts/build-release.py` 只写在 CLAUDE.md 和
# docs/GITHUB_PUBLISHING.md 里靠手工执行，没有任何自动化。后果是真实的：发布构建
# 有一份白名单（scripts/build-release.py 的 root_files），新增根目录文件若忘了登记，
# 只有等到手工打包时才会以 `Unexpected file` 失败 —— 而打包的人可能已经忘了这回事。
#
# 这个工作流不改变任何检查内容，只是让它们在任何一次 push/PR 上真的跑起来。
#
# Lint 也是同样的道理：`npm run check:architecture` 的上限值（入口行数、经典脚本
# 标签数、源码截取测试数）只有在有人手动跑时才生效，而 ESLint 的两条规则——no-undef
# 和 local/no-eager-use-before-init——是唯一能发现「模块搬走了但调用点没跟上」这类
# 问题的检查：前者管名字没了，后者管名字还在但按值传入时还没赋值。重构分支上就是这样
# 漏了三处。
name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 只需要读仓库；构建产物写到 dist/，不发布任何东西。
permissions:
  contents: read

# 同一分支的旧运行在推送新提交后没有意义，取消掉。
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # 产品是 Windows 优先，且测试对平台自适应：
    # 与 Windows 任务注册/包安装相关的用例带 `{ skip: process.platform !== 'win32' }`，
    # 在别的系统上会被跳过而不是失败。跑在 Windows 上，这些用例才会真正执行。
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Node 版本下限见 package.json 的 engines（>=24）。
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # 唯一的依赖是 devDependency 里的 ESLint；单元测试仍然只用 Node 内置模块，
      # 发行包也不包含 node_modules（见 scripts/build-release.py 的 blocked 集合）。
      - name: Install dev dependencies
        run: npm ci

      # scripts/build-release.py 需要 Python 3.10+（见 docs/GITHUB_PUBLISHING.md）。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # no-undef：把「引用了但既没定义也没导入」的名字挡在合并之前。
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # 维护指标上限：入口行数、经典脚本标签数、源码截取测试数、音效边界的禁止依赖。
      - name: Architecture boundaries
        run: npm run check:architecture

      # 一次跑完：公开文件白名单、隐私扫描、Markdown 相对链接检查、ZIP 完整性，
      # 以及发行包必须包含的运行时依赖与入口脚本断言。
      - name: Release build checks
        run: python scripts/build-release.py
